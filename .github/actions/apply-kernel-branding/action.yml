name: 'Apply Kernel Branding'
description: 'Apply Wild kernel branding to kernel version string'
inputs:
  build_type:
    description: 'Build type (Normal, Bypass, MarionKernel, Hakan, etc.)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 5.10, 6.1, 6.6)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/aosp
      run: |
        # STEALTH: do NOT append the "-Wild" marker — keep the version string genuine.
        # (Original WildKernels branding patched scripts/setlocalversion to add -Wild; removed.)

        # NOTE: kleaf enforces SUBLEVEL against the KMI (source is 6.1.124); forcing 145 breaks
        # the modules_prepare KMI check. So we build the native 124 and let --stamp derive the
        # real scmversion from the AOSP source git. (145 stamp requires a KMI-check bypass; TODO.)
        echo "Makefile version: $(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | tr '\n' ' ')"
        : > .scmversion

        echo "Getting last commit timestamp from kernel source..."

        COMMIT_TIMESTAMP=$(git log -1 --format=%ct 2>/dev/null || echo "$(date +%s)")
        KERNEL_BUILD_DATE=$(date -u)

        export SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP
        echo "SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP" >> $GITHUB_ENV
        
        export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_DATE"
        echo "KBUILD_BUILD_TIMESTAMP=$KERNEL_BUILD_DATE" >> $GITHUB_ENV
