name: 'Apply Kernel Branding'
description: 'Apply Wild kernel branding to kernel version string'
inputs:
  build_type:
    description: 'Build type (Normal, Bypass, MarionKernel, Hakan, etc.)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 5.10, 6.1, 6.6)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/aosp
      run: |
        # STEALTH: do NOT append the "-Wild" marker — keep the version string genuine.
        # (Original WildKernels branding patched scripts/setlocalversion to add -Wild; removed.)

        # STEALTH: this AOSP source is sublevel 6.1.124, but the target device ships 6.1.145
        # (genuine vendor_dlkm vermagic 6.1.145-android14-11). Force SUBLEVEL=145 so UTS_RELEASE
        # base matches the device exactly (KMI generation android14-11 is unchanged → GKI ABI-safe).
        sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 145/' Makefile
        echo "Makefile version now: $(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | tr '\n' ' ')"

        # STEALTH: hardcode the EXACT genuine scmversion captured from this device's
        # Google-signed vendor_dlkm vermagic (6.1.145-android14-11-gfa1d6308d1fe-ab14691759).
        # setlocalversion's scm_version() returns the contents of .scmversion if present,
        # so UTS_RELEASE becomes 6.1.145<config_localversion=-android14-11><scm=-gfa1d6308d1fe-ab14691759>.
        echo "-gfa1d6308d1fe-ab14691759" > .scmversion

        echo "Getting last commit timestamp from kernel source..."

        COMMIT_TIMESTAMP=$(git log -1 --format=%ct 2>/dev/null || echo "$(date +%s)")
        KERNEL_BUILD_DATE=$(date -u)

        export SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP
        echo "SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP" >> $GITHUB_ENV
        
        export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_DATE"
        echo "KBUILD_BUILD_TIMESTAMP=$KERNEL_BUILD_DATE" >> $GITHUB_ENV
